<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Figure Manager — {{figuremanager_name}}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body {
            font-family: system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
            margin: 24px;
            background: #ffffff;   /* light background */
            color: #111418;        /* dark text */
        }
        a { color: #0b69ff; text-decoration: none }
        a:hover { text-decoration: underline }
        .grid {
            display: grid; gap: 12px;
            grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
        }
        .card {
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        code {
            background: #f4f4f5;
            padding: 2px 6px;
            border-radius: 6px;
        }
        header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 18px;
        }
        .logo {
            width: 80px; height: 80px;
            display: grid; place-items: center;
            overflow: hidden;
        }
        .logo svg { display: block; width: 100%; height: 100% }
        .muted { color: #4b5563 }
        .chip {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 2px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            background: #0b69ff14;
        }
    </style>
</head>
<body>

<header>
    <div class="logo" aria-hidden="true">
        {{& logo_svg}} <!-- raw SVG injected from code -->
    </div>
    <div>
        <h1 style="margin:0">Figure Manager</h1>
        <div class="muted">
            Instance: <b>{{figuremanager_name}}</b> ·
            <span class="chip">Total: <b>{{count}}</b></span>
        </div>
    </div>
</header>

<section class="grid" aria-label="Figures list">
    {{#figures}}
    <article class="card">
        <div><b>#{{index1}}</b> — {{title}}</div>
        <div style="margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px">
            <a href="/figure/{{index1}}">/figure/{{index1}}</a>
        </div>
    </article>
    {{/figures}}

    {{^has_figures}}
    <article class="card">No figures yet. POST or add via API.</article>
    {{/has_figures}}
</section>

<p class="muted" style="margin-top:16px">
    <small>Health: <code>/health</code></small>
</p>

</body>
</html>
