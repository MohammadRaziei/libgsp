<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8" />
    <title>Figure Manager</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:24px}
        a{color:#06f;text-decoration:none}
        a:hover{text-decoration:underline}
        .grid{display:grid;gap:8px}
        .card{padding:12px 16px;border:1px solid #e5e7eb;border-radius:10px}
        code{background:#f4f4f5;padding:2px 6px;border-radius:6px}
    </style>
</head><body>

<h1>Figure Manager</h1>
<p>Total figures: <b>{{count}}</b></p>

<div class="grid">
    {{#figures}}
    <div class="card">
        <div><b>#{{index1}}</b> &mdash; {{title}}</div>
        <div><a href="/figure/{{index1}}">/figure/{{index1}}</a></div>
    </div>
    {{/figures}}

    {{^has_figures}}
    <div class="card">No figures yet. POST or add via API.</div>
    {{/has_figures}}
</div>

<p><small>Health: <code>/health</code></small></p>

</body></html>
