<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>SVG + Three.js (Parse 3D from inline SVG)</title>

    <!-- Import map for three + addons -->
    <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.173.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.173.0/examples/jsm/"
          }
        }
    </script>

    <style>
        html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fff}
        .topbar{position:fixed;top:12px;left:12px;z-index:10000;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08)}
        .topbar button{border:0;background:#f6f7f9;padding:8px 12px;font-weight:600}
        .topbar button.active{background:#1f6feb;color:#fff}
        .container{position:absolute;inset:0;padding-top:56px}
        #panel2d,#panel3d{position:absolute;inset:0}
        #panel3d{display:none}
        #panel2d{display:flex;align-items:center;justify-content:center}

        /* Tooltip (shared) */
        .tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(0,0,0,0.78);
            color: #fff;
            font: 12px/1.4 system-ui, sans-serif;
            padding: 8px 10px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            transform: translate(12px, -50%);
            white-space: nowrap;
            z-index: 9999;
            display: none;
        }
        .tooltip.left { transform: translate(-12px, -50%); }
        .tooltip .row { margin: 2px 0; }
        .tooltip .k { opacity: 0.7; padding-right: 6px; }
        .tooltip .v { font-weight: 600; }

        /* Keep the inline SVG nicely sized in 2D panel */
        #graphSVG{width:min(96vw,1200px);height:calc(100vh - 96px);border:0px solid #eee;border-radius:8px}
    </style>
</head>
<body>

<!-- Segmented toggle -->
<div class="topbar">
    <button id="btn2d" class="active">2D (SVG)</button>
    <button id="btn3d">3D (WebGL)</button>
</div>

<div class="container">
    <!-- 2D panel (your data-carrying SVG lives here) -->
    <div id="panel2d">
        <!-- === Paste your exact SVG below === -->
        <svg id="graphSVG" xmlns="http://www.w3.org/2000/svg" width="340" height="171">
            <metadata>
                <generator name="libgsp" author="Mohammad Raziei" site="https://mohammadraziei.github.io/libgsp  " />
                <libgsp version="0.0.0" language="cpp" os="linux"/>
                <content format="svg" tags="plot graph signal bar"/>
                <plotinfo signalscale="100" nodespacescale="100"/>
            </metadata>
            <title>Network</title>
            <style>
                .node { fill: #00BCE3; stroke: black; stroke-width: 0.7; opacity: 0.8}
                .node-label { font-size: 12; text-anchor:middle; dominant-baseline:middle; }
                .signal { stroke: red; fill: red; stroke-width: 2;}
                circle.signal { r: 1; }
                .signal-text { fill: red; }
                .edge { stroke: black; stroke-width: 1.5; }
            </style>

            <!-- edges -->
            <line class="edge" x1="20" y1="51.0" x2="220" y2="51.0" v1="0" v2="1" weight="1"/>
            <line class="edge" x1="20" y1="51.0" x2="120" y2="151.0" v1="0" v2="2" weight="1"/>
            <line class="edge" x1="220" y1="51.0" x2="120" y2="151.0" v1="1" v2="2" weight="1"/>
            <line class="edge" x1="120" y1="151.0" x2="320" y2="151.0" v1="2" v2="3" weight="1"/>

            <!-- node 0 -->
            <circle class="node" cx="20"  cy="51.0"  r="8" sig="-0.04" vx="0" vy="0"  vz="0" v="0" name="v0"/>
            <text class="node-label" x="20"  y="51.0">v0</text>
            <line class="signal" x1="20" y1="51.0" x2="20" y2="55.0"/>
            <circle class="signal" cx="20" cy="55.0" r="1"/>
            <text class="signal-text" text-anchor="middle" dominant-baseline="middle" font-size="6px" x="20" y="61.0">-0.04</text>

            <!-- node 1 -->
            <circle class="node" cx="220" cy="51.0"  r="8" sig="0.31" vx="2" vy="0"  vz="0" v="1" name="v1"/>
            <text class="node-label" x="220" y="51.0">v1</text>
            <line class="signal" x1="220" y1="51.0" x2="220" y2="20.0"/>
            <circle class="signal" cx="220" cy="20.0" r="1"/>
            <text class="signal-text" text-anchor="middle" dominant-baseline="middle" font-size="6px" x="220" y="14.0">0.31</text>

            <!-- node 2 -->
            <circle class="node" cx="120" cy="151.0" r="8" sig="0.06" vx="1" vy="-1" vz="0" v="2" name="v2"/>
            <text class="node-label" x="120" y="151.0">v2</text>
            <line class="signal" x1="120" y1="151.0" x2="120" y2="145.0"/>
            <circle class="signal" cx="120" cy="145.0" r="1"/>
            <text class="signal-text" text-anchor="middle" dominant-baseline="middle" font-size="6px" x="120" y="139.0">0.06</text>

            <!-- node 3 -->
            <circle class="node" cx="320" cy="151.0" r="8" sig="0.39" vx="3" vy="-1" vz="0" v="3" name="v3"/>
            <text class="node-label" x="320" y="151.0">v3</text>
            <line class="signal" x1="320" y1="151.0" x2="320" y2="112.0"/>
            <circle class="signal" cx="320" cy="112.0" r="1"/>
            <text class="signal-text" text-anchor="middle" dominant-baseline="middle" font-size="6px" x="320" y="106.0">0.39</text>
        </svg>
    </div>

    <!-- 3D panel (will be populated from the SVG above) -->
    <div id="panel3d"></div>
</div>

<!-- Shared tooltip (used in both 2D hover and 3D raycast) -->
<div id="tooltip" class="tooltip"></div>

<script type="module">
    // ---------------------------- Imports ----------------------------
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { DragControls }  from "three/addons/controls/DragControls.js";

    // ---------------------------- UI refs ----------------------------
    const btn2d = document.getElementById('btn2d');
    const btn3d = document.getElementById('btn3d');
    const panel2d = document.getElementById('panel2d');
    const panel3d = document.getElementById('panel3d');
    const tip = document.getElementById('tooltip');
    const svg = document.getElementById('graphSVG');

    // Ensure viewBox for consistent scaling in 2D view
    if (!svg.getAttribute('viewBox')) {
        const w = svg.width.baseVal.value, h = svg.height.baseVal.value;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    }

    // ---------------------------- Parse SVG data ----------------------------
    // Read scales from metadata (optional)
    const plotinfo = svg.querySelector('plotinfo') || svg.querySelector('metadata plotinfo');
    const signalscale = plotinfo ? parseFloat(plotinfo.getAttribute('signalscale')||'100') : 100;
    // const nodespacescale = plotinfo ? parseFloat(plotinfo.getAttribute('nodespacescale')||'100') : 100;

    // Collect nodes
    const nodes = Array.from(svg.querySelectorAll('circle.node')).map(el => ({
        id: parseInt(el.getAttribute('v')),
        name: el.getAttribute('name') || ('v' + el.getAttribute('v')),
        s: parseFloat(el.getAttribute('sig') || '0'),
        vx: parseFloat(el.getAttribute('vx') || '0'),
        vy: parseFloat(el.getAttribute('vy') || '0'),
        vz: parseFloat(el.getAttribute('vz') || '0'),
    }));
    const idMap = new Map(nodes.map(n => [n.id, n]));

    // Collect edges
    const edges = Array.from(svg.querySelectorAll('line.edge')).map(el => ({
        a: parseInt(el.getAttribute('v1')),
        b: parseInt(el.getAttribute('v2')),
    }));

    // 2D hover tooltip (simple)
    svg.addEventListener('mousemove', (ev) => {
        const t = ev.target;
        if (t && t.classList.contains('node')) {
            const id = parseInt(t.getAttribute('v'));
            const n = idMap.get(id);
            if (n) showTooltip(n, ev.clientX, ev.clientY);
        } else {
            hideTooltip();
        }
    });
    svg.addEventListener('mouseleave', hideTooltip);

    // Tooltip helpers
    function showTooltip(n, clientX, clientY) {
        tip.innerHTML =
            `<div class="row"><span class="k">vertex id:</span><span class="v">${n.id}</span></div>
     <div class="row"><span class="k">name:</span><span class="v">${n.name}</span></div>
     <div class="row"><span class="k">signal:</span><span class="v">${n.s.toFixed(3)}</span></div>
     <div class="row"><span class="k">(x,y,z):</span><span class="v">(${n.vx.toFixed(2)}, ${n.vy.toFixed(2)}, ${n.vz.toFixed(2)})</span></div>`;
        const margin=12, w=tip.offsetWidth||180, rightSpace=innerWidth-clientX;
        const right = rightSpace > w + margin;
        tip.style.left = (right ? (clientX + margin) : (clientX - margin)) + 'px';
        tip.style.top  = clientY + 'px';
        tip.classList.toggle('left', !right);
        tip.style.display = 'block';
    }
    function hideTooltip(){ tip.style.display = 'none'; }

    // ---------------------------- 3D setup (from SVG data) ----------------------------
    let renderer, scene, camera, orbit, drag, running=false;
    let nodeMeshes = [], edgeLines, edgeGeom, edgePos;
    let raycaster, mouse;
    let hovering = null, dragging = null;

    function build3DOnce() {
        if (scene) return; // already built

        // Create renderer/camera/scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        camera = new THREE.PerspectiveCamera(60, panel3d.clientWidth/panel3d.clientHeight, 0.1, 5000);
        camera.position.set(0, 0, 140);

        renderer = new THREE.WebGLRenderer({ antialias:true });
        renderer.setSize(panel3d.clientWidth, panel3d.clientHeight);
        panel3d.appendChild(renderer.domElement);

        orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.35));
        const dir = new THREE.DirectionalLight(0xffffff, 0.7); dir.position.set(60,100,80); scene.add(dir);
        const pt  = new THREE.PointLight(0xffffff, 0.5, 300);  pt.position.set(-40,-30,90); scene.add(pt);

        // Fit SVG world to 3D world (auto scale/center)
        const bb = computeBounds(nodes);
        const center = new THREE.Vector3((bb.minx+bb.maxx)/2, (bb.miny+bb.maxy)/2, (bb.minz+bb.maxz)/2);
        const extent = Math.max(bb.maxx-bb.minx, bb.maxy-bb.miny, bb.maxz-bb.minz) || 1;
        const target = 120; // world units target size
        const unitScale = target / extent;

        // Build 3D nodes (spheres)
        const nodeGeom = new THREE.SphereGeometry(2.8, 16, 16);
        nodes.forEach(n => {
            const m = new THREE.Mesh(
                nodeGeom,
                new THREE.MeshStandardMaterial({ color:0x00FFFF, metalness:0.2, roughness:0.9, transparent:true, opacity:0.75 })
            );
            m.position.set(
                (n.vx - center.x) * unitScale,
                (n.vy - center.y) * unitScale,
                (n.vz - center.z) * unitScale
            );
            m.scale.setScalar(1.0 + 0.5*Math.abs(n.s));
            m.userData.node = n;
            // n.mesh = m;
            n.coords = ()=>({x: m.position.x / unitScale + center.x,
                y: m.position.y / unitScale + center.y,
                z: m.position.z / unitScale + center.z});
            nodeMeshes.push(m);
            scene.add(m);
        });

        // Build 3D edges (single LineSegments)
        edgePos = new Float32Array(edges.length*2*3);
        edgeGeom = new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(edgePos,3));
        edgeLines = new THREE.LineSegments(edgeGeom, new THREE.LineBasicMaterial({ color: 0x777777 }));
        scene.add(edgeLines);

        function updateEdges3D() {
            let p=0;
            const map = new Map(nodeMeshes.map(m => [m.userData.node.id, m]));
            edges.forEach(e => {
                const A = map.get(e.a).position;
                const B = map.get(e.b).position;
                edgePos[p++]=A.x; edgePos[p++]=A.y; edgePos[p++]=A.z;
                edgePos[p++]=B.x; edgePos[p++]=B.y; edgePos[p++]=B.z;
            });
            edgeGeom.attributes.position.needsUpdate = true;
        }
        updateEdges3D();

        // Build signal stems (billboarded, vertical on screen)
        const STEM_WORLD = target * 0.12; // world units when |s|=1
        const LABEL_OFFSET = 2.4;

        function makeTextSprite(text,{fontSize=28,fontFamily="system-ui, sans-serif",textColor="red",padding=8,worldScale=0.06,background=null}={}) {
            const cvs=document.createElement("canvas"), ctx=cvs.getContext("2d");
            const dpr=Math.max(1,Math.min(devicePixelRatio||1,2));
            const font=`${fontSize}px ${fontFamily}`;
            ctx.font=font; const tw=Math.ceil(ctx.measureText(text).width), th=Math.ceil(fontSize*1.2);
            const w=tw+padding*2, h=th+padding*2; cvs.width=w*dpr; cvs.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
            if(background){ ctx.fillStyle=background; ctx.fillRect(0,0,w,h); }
            ctx.font=font; ctx.fillStyle=textColor; ctx.textBaseline="middle"; ctx.fillText(text, padding, h/2);
            const tex=new THREE.CanvasTexture(cvs);
            const spr=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
            spr.scale.set(w*worldScale, h*worldScale, 1); return spr;
        }

        nodes.forEach((n,i) => {
            const g = new THREE.Object3D();
            const lineGeom = new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0) ]);
            const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xff0000 }));
            const tip  = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            tip.position.y = 1;
            const label = makeTextSprite(n.s.toFixed(2), { fontSize: 24, textColor:"red", worldScale:0.05 });
            label.position.set(0, 1 + LABEL_OFFSET, 0);
            g.add(line, tip, label);
            g.userData = { node: n, line, tip, label };
            // attach group to node mesh
            const m = nodeMeshes[i];
            g.position.copy(m.position);
            scene.add(g);
            n._stem = g;
        });

        function syncStems() {
            nodes.forEach((n,i) => {
                const g = n._stem;
                const m = nodeMeshes[i];
                // stick to node + billboard
                g.position.copy(m.position);
                g.quaternion.copy(camera.quaternion);
                // length by signal
                const L = STEM_WORLD * Math.abs(n.s);
                const sign = n.s >= 0 ? 1 : -1;
                const arr = g.userData.line.geometry.attributes.position.array;
                arr[3]=0; arr[4]=sign*L; arr[5]=0;
                g.userData.line.geometry.attributes.position.needsUpdate = true;
                g.userData.tip.position.y   = sign*L;
                g.userData.label.position.y = sign*L + (sign>0 ? LABEL_OFFSET : -LABEL_OFFSET);
                // label text
                // (optional) could update text dynamically if n.s changes
            });
        }
        syncStems();

        // =====================================================================
        // MATLAB-like SURF box grid on all 6 faces + corner axes with labels
        // =====================================================================

        function addMatlabSurfBoxGrid({
                                          divisions = 20,           // grid subdivisions per face
                                          opacity = 0.28,           // grid line opacity
                                          colorMajor = 0xcccccc,    // main grid color
                                          colorMinor = 0xeeeeee,    // minor grid color (GridHelper uses both)
                                          axesCorner = "min",       // "min" -> axes at (minX,minY,minZ), "max" -> (maxX,maxY,maxZ)
                                          margin = 20,              // padding around data bounds
                                          overrideSize = null       // if set, force cube size (number or {x,y,z})
                                      } = {}) {
            // 1) compute bounds from nodes
            const boundingBox = new THREE.Box3();
            if (nodes.length === 0) {
                boundingBox.setFromCenterAndSize(new THREE.Vector3(0,0,0), new THREE.Vector3(100,100,100));
            } else {
                nodes.forEach(n => {
                    // Convert original coordinates to 3D positions
                    const x = (n.vx - center.x) * unitScale;
                    const y = (n.vy - center.y) * unitScale;
                    const z = (n.vz - center.z) * unitScale;
                    boundingBox.expandByPoint(new THREE.Vector3(x, y, z));
                });
            }

            const gridCenter = boundingBox.getCenter(new THREE.Vector3());
            const size = boundingBox.getSize(new THREE.Vector3());

            // make it a cube (like MATLAB axis equal); add margin
            const side = Math.max(size.x, size.y, size.z) + margin * 2;

            // allow override
            const Lx = overrideSize?.x ?? overrideSize ?? side;
            const Ly = overrideSize?.y ?? overrideSize ?? side;
            const Lz = overrideSize?.z ?? overrideSize ?? side;

            // min/max corners (cube centered at data center)
            const min = new THREE.Vector3(
                gridCenter.x - Lx/2,
                gridCenter.y - Ly/2,
                gridCenter.z - Lz/2
            );
            const max = new THREE.Vector3(
                gridCenter.x + Lx/2,
                gridCenter.y + Ly/2,
                gridCenter.z + Lz/2
            );

            // helper to place a GridHelper on a plane at given position + rotation
            function addPlaneGrid(length, divs, pos, rotEuler) {
                const g = new THREE.GridHelper(length, divs, colorMajor, colorMinor);
                g.material.transparent = true;
                g.material.opacity = opacity;
                g.material.depthWrite = false;
                g.renderOrder = -1; // draw behind meshes
                g.position.copy(pos);
                g.rotation.set(rotEuler.x, rotEuler.y, rotEuler.z);
                scene.add(g);
                return g;
            }

            // 2) six faces: XY at z=min,max; XZ at y=min,max; YZ at x=min,max
            // XY @ z = min, max
            addPlaneGrid(Math.max(Lx, Ly), divisions,
                new THREE.Vector3(gridCenter.x, gridCenter.y, min.z),
                new THREE.Euler(Math.PI/2, 0, 0)); // rotate to XY
            addPlaneGrid(Math.max(Lx, Ly), divisions,
                new THREE.Vector3(gridCenter.x, gridCenter.y, max.z),
                new THREE.Euler(Math.PI/2, 0, 0));

            // XZ @ y = min, max  (default GridHelper plane is XZ, rotation 0)
            addPlaneGrid(Math.max(Lx, Lz), divisions,
                new THREE.Vector3(gridCenter.x, min.y, gridCenter.z),
                new THREE.Euler(0, 0, 0));
            addPlaneGrid(Math.max(Lx, Lz), divisions,
                new THREE.Vector3(gridCenter.x, max.y, gridCenter.z),
                new THREE.Euler(0, 0, 0));

            // YZ @ x = min, max
            addPlaneGrid(Math.max(Ly, Lz), divisions,
                new THREE.Vector3(min.x, gridCenter.y, gridCenter.z),
                new THREE.Euler(0, 0, Math.PI/2)); // rotate to YZ
            addPlaneGrid(Math.max(Ly, Lz), divisions,
                new THREE.Vector3(max.x, gridCenter.y, gridCenter.z),
                new THREE.Euler(0, 0, Math.PI/2));

            // 3) draw axes on a corner edge (MATLAB style)
            const corner = (axesCorner === "max")
                ? max.clone()
                : min.clone();

            // axis lines along positive directions from the corner
            const axisMatX = new THREE.LineBasicMaterial({ color: 0xff0000 });
            const axisMatY = new THREE.LineBasicMaterial({ color: 0x00ff00 });
            const axisMatZ = new THREE.LineBasicMaterial({ color: 0x0000ff });

            function axisLine(from, to, mat) {
                const geom = new THREE.BufferGeometry().setFromPoints([from, to]);
                const ln = new THREE.Line(geom, mat);
                ln.renderOrder = 0.5; // above grids
                scene.add(ln);
                return ln;
            }

            // X axis: corner -> +X edge
            axisLine(
                corner,
                new THREE.Vector3(max.x, corner.y, corner.z),
                axisMatX
            );
            // Y axis: corner -> +Y edge
            axisLine(
                corner,
                new THREE.Vector3(corner.x, max.y, corner.z),
                axisMatY
            );
            // Z axis: corner -> +Z edge
            axisLine(
                corner,
                new THREE.Vector3(corner.x, corner.y, max.z),
                axisMatZ
            );

            // 4) axis labels (X Y Z) at ends
            const labelScale = 0.09;
            const pad = 2; // small offset away from edge
            const xLbl = makeTextSprite("X", { fontSize: 24, textColor: "#c00", worldScale: labelScale });
            xLbl.position.set(max.x + pad, corner.y, corner.z); scene.add(xLbl);
            const yLbl = makeTextSprite("Y", { fontSize: 24, textColor: "#090", worldScale: labelScale });
            yLbl.position.set(corner.x, max.y + pad, corner.z); scene.add(yLbl);
            const zLbl = makeTextSprite("Z", { fontSize: 24, textColor: "#06f", worldScale: labelScale });
            zLbl.position.set(corner.x, corner.y, max.z + pad); scene.add(zLbl);

            // return bounds if caller needs them
            return { min, max, center: gridCenter, size: new THREE.Vector3(Lx, Ly, Lz) };
        }

        // Add the MATLAB-style grid
        addMatlabSurfBoxGrid({
            divisions: 20,
            opacity: 0.3,
            axesCorner: "min",
            margin: 20
        });

        // Drag controls for nodes
        drag = new DragControls(nodeMeshes, camera, renderer.domElement);
        drag.addEventListener("dragstart", (e)=>{ orbit.enabled=false; dragging=e.object; showTip3D(dragging); });
        drag.addEventListener("drag", ()=>{ updateEdges3D(); syncStems(); updateTip3DIfAny(); });
        drag.addEventListener("dragend", ()=>{ orbit.enabled=true; dragging=null; });

        // Hover tooltip via raycaster
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        window.addEventListener('mousemove', (ev)=>{
            if (!running) return;
            if (dragging) { updateTip3DIfAny(); return; }
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(nodeMeshes, false);
            if (hits.length) {
                const hit = hits[0].object;
                if (hovering !== hit) { hovering = hit; showTip3D(hit); }
                else updateTip3DIfAny();
                renderer.domElement.style.cursor = "pointer";
            } else {
                hovering = null;
                if (!dragging) hideTooltip();
                renderer.domElement.style.cursor = "";
            }
        });

        function worldToScreen(p) {
            const v = p.clone().project(camera);
            return { x:( v.x*0.5+0.5)*renderer.domElement.clientWidth + renderer.domElement.getBoundingClientRect().left,
                y:(-v.y*0.5+0.5)*renderer.domElement.clientHeight + renderer.domElement.getBoundingClientRect().top };
        }
        function setTipContent(n) {
            const coords = n.coords();
            tip.innerHTML =
                `<div class="row"><span class="k">vertex id:</span><span class="v">${n.id}</span></div>
       <div class="row"><span class="k">name:</span><span class="v">${n.name}</span></div>
       <div class="row"><span class="k">signal:</span><span class="v">${n.s.toFixed(3)}</span></div>
       <div class="row"><span class="k">(x,y,z):</span>
         <span class="v">(${coords.x.toFixed(2)}, ${coords.y.toFixed(2)}, ${coords.z.toFixed(2)})</span>
       </div>`;
        }
        function showTip3D(mesh) {
            const n = mesh.userData.node; setTipContent(n);
            const p = worldToScreen(mesh.getWorldPosition(new THREE.Vector3()));
            positionTip(p.x, p.y);
        }
        function updateTip3DIfAny(){
            const m = dragging || hovering; if (!m) return;
            // refresh content (coords may change while dragging)
            setTipContent(m.userData.node);
            const p = worldToScreen(m.getWorldPosition(new THREE.Vector3()));
            positionTip(p.x, p.y);
        }
        function positionTip(x,y){
            const margin=12, w=tip.offsetWidth||180, rightSpace=innerWidth-x;
            const right = rightSpace > w + margin;
            tip.style.left = (right ? (x + margin) : (x - margin)) + "px";
            tip.style.top  = y + "px";
            tip.classList.toggle("left", !right);
            tip.style.display = "block";
        }

        // Resize handling
        window.addEventListener('resize', ()=>{
            if (!renderer) return;
            renderer.setSize(panel3d.clientWidth, panel3d.clientHeight);
            camera.aspect = panel3d.clientWidth / panel3d.clientHeight;
            camera.updateProjectionMatrix();
        });

        // Animation loop
        (function animate(){
            requestAnimationFrame(animate);
            if (!running) return;
            orbit.update();
            renderer.render(scene, camera);
            syncStems();
            if (hovering || dragging) updateTip3DIfAny();
        })();
    }

    function computeBounds(arr){
        let minx=+Infinity,miny=+Infinity,minz=+Infinity;
        let maxx=-Infinity,maxy=-Infinity,maxz=-Infinity;
        arr.forEach(n=>{
            if (n.vx<minx) minx=n.vx; if (n.vx>maxx) maxx=n.vx;
            if (n.vy<miny) miny=n.vy; if (n.vy>maxy) maxy=n.vy;
            if (n.vz<minz) minz=n.vz; if (n.vz>maxz) maxz=n.vz;
        });
        return {minx,miny,minz,maxx,maxy,maxz};
    }

    // ---------------------------- Toggle logic ----------------------------
    btn2d.addEventListener('click', ()=>{
        btn2d.classList.add('active'); btn3d.classList.remove('active');
        panel2d.style.display = 'flex';
        panel3d.style.display = 'none';
        hideTooltip();
        running = false; // pause 3D loop work
    });
    btn3d.addEventListener('click', ()=>{
        btn3d.classList.add('active'); btn2d.classList.remove('active');
        panel2d.style.display = 'none';
        panel3d.style.display = 'block';
        build3DOnce();
        running = true; // resume 3D loop work
    });

    // Default view = 2D (already visible)

    // Optional: if you want 3D by default, just trigger the click:
    // btn3d.click();

</script>
